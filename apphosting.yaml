# Firebase App Hosting configuration for the R&R Newtech store (Next.js SSR).
# Non-secret values live here (safe to commit). Sensitive values are stored in
# Secret Manager and only REFERENCED by name below — never paste secret values here.
#
# Before the first deploy, create the referenced secrets and grant the backend access:
#   firebase apphosting:secrets:set FIREBASE_CLIENT_EMAIL
#   firebase apphosting:secrets:set FIREBASE_PRIVATE_KEY
#   firebase apphosting:secrets:set FIREBASE_WEB_API_KEY
#   firebase apphosting:secrets:set ADMIN_SESSION_SECRET
#   firebase apphosting:secrets:set PAYMONGO_SECRET_KEY
#   firebase apphosting:secrets:set PAYMONGO_WEBHOOK_SECRET
#   firebase apphosting:secrets:set RESEND_API_KEY
# (each command prompts for the value and offers to grant access automatically).

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # --- Non-secret Firebase config ---
  - variable: FIREBASE_PROJECT_ID
    value: rnr-dental-clinics
    availability: [ BUILD, RUNTIME ]

  - variable: FIREBASE_STORAGE_BUCKET
    value: rnr-dental-clinics.firebasestorage.app
    availability: [ BUILD, RUNTIME ]

  # Public site URL for canonical links / sitemap / OG tags — and for the PayMongo success and
  # cancel URLs, and the address Firebase sends account-verification links back to.
  #
  # Baked in at BUILD time (every NEXT_PUBLIC_* var is), so changing it needs a ROLLOUT, not just a
  # restart. It must match the domain customers actually reach the site on. While it pointed at the
  # backend's default `hosted.app` address, the custom domain served pages whose canonical, OG url,
  # sitemap and robots `Host` all named hosted.app instead — which tells Google to index the wrong
  # hostname — and PayMongo's "back to store" link dropped customers onto hosted.app mid-checkout.
  #
  # The apex is deliberate: www.rrnewtechdental.com is not currently mapped to this backend.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://rrnewtechdental.com
    availability: [ BUILD, RUNTIME ]

  # --- Analytics ---
  # Pixel IDs are public (they ship in every page's HTML), so this is plain config, not a secret.
  # Baked in at BUILD time like every NEXT_PUBLIC_* var — changing it needs a rollout.
  - variable: NEXT_PUBLIC_META_PIXEL_ID
    value: "1311331890968438"
    availability: [ BUILD, RUNTIME ]
  # GA4 — uncomment and fill when ready.
  # - variable: NEXT_PUBLIC_GA_ID
  #   value: ""
  #   availability: [BUILD, RUNTIME]

  # --- Secrets (stored in Secret Manager, referenced by name) ---
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [ BUILD, RUNTIME ]

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability: [ BUILD, RUNTIME ]

  - variable: FIREBASE_WEB_API_KEY
    secret: FIREBASE_WEB_API_KEY
    availability: [ BUILD, RUNTIME ]

  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET
    availability: [ BUILD, RUNTIME ]

  # --- PayMongo (checkout) ---
  # RUNTIME only, unlike the FIREBASE_* secrets above: nothing at build time touches PayMongo
  # (those need BUILD because catalog content is read during static generation), so there is no
  # reason to expose these to the build and its logs.
  #
  # The webhook secret comes from the webhook resource itself, NOT the API keys page, and is shown
  # only once when you create it. Test and live webhooks are separate resources with separate
  # secrets — swapping to live keys means creating a live webhook too.
  - variable: PAYMONGO_SECRET_KEY
    secret: PAYMONGO_SECRET_KEY
    availability: [ RUNTIME ]

  - variable: PAYMONGO_WEBHOOK_SECRET
    secret: PAYMONGO_WEBHOOK_SECRET
    availability: [ RUNTIME ]

  # --- Staff notification email (Resend) ---
  # RUNTIME only, like PayMongo: nothing sends mail during a build. The sender must be on a domain
  # verified in Resend, or every recipient but the account owner is refused (see .env.example).
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [ RUNTIME ]

  - variable: EMAIL_FROM
    value: "R&R Newtech Dental <notifications@rrnewtechdental.com>"
    availability: [ RUNTIME ]
  - variable: HUBSPOT_ACCESS_TOKEN
    secret: HUBSPOT_ACCESS_TOKEN
  # --- HubSpot CRM (inquiries → contacts / leads) ---
  # HUBSPOT-DISABLED — on hold; see docs/hubspot-integration.md to turn it back on.
  # RUNTIME only, like Resend. The secret must exist BEFORE this file is rolled out — a rollout that
  # references a missing secret fails. Create it with the production HubSpot account's key:
  #   firebase apphosting:secrets:set HUBSPOT_ACCESS_TOKEN
  # - variable: HUBSPOT_ACCESS_TOKEN
  #   secret: HUBSPOT_ACCESS_TOKEN
  #   availability: [RUNTIME]

